{% extends "base.html" %}
{% block title %}报警事件管理 - {{ site_name }}{% endblock %}
{% block extra_css %}
<style>.page-container{padding:20px;background:#f5f6fa;min-height:calc(100vh - 100px)}.card-custom{background:#fff;border-radius:14px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,.06)}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px}.table th{background:#f8f9fa;font-size:13px;font-weight:700;color:#1a1a2e;border-bottom:2px solid #e74c3c}</style>{% endblock %}
{% block content %}
<div class="page-container"><div class="container-fluid"><div class="card-custom">
<div class="toolbar"><h4 class="fw-bold m-0"><i class="bi bi-exclamation-triangle me-2"></i>报警事件管理</h4></div>
<div class="row mb-3 g-2"><div class="col-md-2"><input class="form-control form-control-sm" placeholder="事件编号/位置" id="fKeyword"></div><div class="col-md-2"><select class="form-select form-select-sm" id="fEventType"><option value="">事件类型</option><option value="1">火焰报警</option><option value="2">烟雾报警</option><option value="3">设备异常</option></select></div><div class="col-md-2"><select class="form-select form-select-sm" id="fAlarmLevel"><option value="">报警级别</option><option value="1">紧急</option><option value="2">重要</option><option value="3">一般</option><option value="4">提示</option></select></div><div class="col-md-2"><select class="form-select form-select-sm" id="fProcessStatus"><option value="">处理状态</option><option value="1">待处理</option><option value="2">处理中</option><option value="3">已处理</option><option value="4">已驳回</option><option value="5">已关闭</option></select></div><div class="col-md-2"><button class="btn btn-outline-secondary btn-sm" onclick="loadEvents()"><i class="bi bi-search"></i> 筛选</button></div></div>
<div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th>ID</th><th>事件编号</th><th>类型</th><th>级别</th><th>置信度</th><th>位置</th><th>摄像头</th><th>检测时间</th><th>状态</th><th>操作</th></tr></thead><tbody id="eventTableBody"></tbody></table></div>
<div class="d-flex justify-content-between mt-3"><small class="text-muted" id="eventPageInfo"></small><div class="btn-group btn-group-sm" id="eventPagination"></div></div>
</div></div></div>

<div class="modal fade" id="eventDetailModal" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content"><div class="modal-header bg-danger text-white"><h6 class="modal-title"><i class="bi bi-fire me-1"></i>报警事件详情</h6><button class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body" id="eventDetailBody"></div><div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">关闭</button></div></div></div></div>
{% endblock %}
{% block extra_js %}
<script>
let eventPage=1;
$(function(){loadEvents();});
function loadEvents(page=1){eventPage=page;let params={page,per_page:15,keyword:$('#fKeyword').val(),event_type:$('#fEventType').val(),alarm_level:$('#fAlarmLevel').val(),process_status:$('#fProcessStatus').val()};Object.keys(params).forEach(k=>{if(!params[k])delete params[k]});$.get('/api/v1/alarm-events',params,function(res){if(res.code===200){let rows=res.data.items.map(e=>`<tr><td>${e.id}</td><td><code>${e.event_code}</code></td><td><span class="badge ${e.event_type===1?'bg-danger':e.event_type===2?'bg-warning':'bg-info'}">${e.event_type_name}</span></td><td><span class="badge ${e.alarm_level===1?'bg-danger':e.alarm_level===2?'bg-warning text-dark':'bg-info'}">${e.alarm_level_name}</span></td><td>${e.detection_confidence?(e.detection_confidence*100).toFixed(1)+'%':'-'}</td><td>${e.location_description||'-'}</td><td>${e.camera_name||'-'}</td><td>${e.detected_at||'-'}</td><td><span class="badge ${e.process_status===1?'bg-danger':e.process_status===3?'bg-success':e.process_status===4?'bg-secondary':'bg-info'}">${e.process_status_name}</span></td><td><button class="btn btn-info btn-sm text-white" onclick="showDetail(${e.id})"><i class="bi bi-eye"></i> 详情</button></td></tr>`).join('');$('#eventTableBody').html(rows||'<tr><td colspan="10" class="text-center py-4 text-muted">暂无数据</td></tr>');$('#eventPageInfo').text(`共 ${res.data.total} 条`);let ph='';for(let i=1;i<=res.data.pages;i++)ph+=`<button class="btn btn-${i===res.data.page?'danger':'outline-secondary'}" onclick="loadEvents(${i})">${i}</button>`;$('#eventPagination').html(ph);}});}
function showDetail(id){$.get('/api/v1/alarm-events/'+id,function(res){if(res.code===200){let e=res.data;$('#eventDetailBody').html(`<div class="row g-3"><div class="col-md-6"><p><strong>事件编号：</strong>${e.event_code}</p><p><strong>事件类型：</strong>${e.event_type_name}</p><p><strong>报警级别：</strong>${e.alarm_level_name}</p><p><strong>检测置信度：</strong>${e.detection_confidence?(e.detection_confidence*100).toFixed(1)+'%':'-'}</p><p><strong>火焰区域占比：</strong>${e.fire_area_ratio?e.fire_area_ratio+'%':'-'}</p></div><div class="col-md-6"><p><strong>经纬度：</strong>${e.longitude?.toFixed(6)}, ${e.latitude?.toFixed(6)}</p><p><strong>位置描述：</strong>${e.location_description||'-'}</p><p><strong>关联摄像头：</strong>${e.camera_name||'-'}</p><p><strong>关联云盒：</strong>${e.cloud_box_name||'-'}</p><p><strong>检测时间：</strong>${e.detected_at||'-'}</p></div><div class="col-12"><p><strong>处理状态：</strong>${e.process_status_name}</p><p><strong>处理备注：</strong>${e.handler_remark||'-'}</p><p><strong>处理时间：</strong>${e.handled_at||'-'}</p></div></div>`);$('#eventDetailModal').modal('show');}});}
</script>
{% endblock %}
