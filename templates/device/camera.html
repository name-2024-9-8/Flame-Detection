{% extends "base.html" %}
{% block title %}摄像头管理 - {{ site_name }}{% endblock %}
{% block extra_css %}
<style>.page-container{padding:20px;background:#f5f6fa;min-height:calc(100vh - 100px)}.card-custom{background:#fff;border-radius:14px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,.06)}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px}.table th{background:#f8f9fa;font-size:13px;font-weight:700;color:#1a1a2e;border-bottom:2px solid #e74c3c}.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}.status-dot.online{background:#27ae60}.status-dot.offline{background:#95a5a6}.status-dot.fault{background:#e74c3c}</style>{% endblock %}
{% block content %}
<div class="page-container"><div class="container-fluid"><div class="card-custom">
<div class="toolbar"><h4 class="fw-bold m-0"><i class="bi bi-camera-video me-2"></i>摄像头管理</h4><button class="btn btn-danger btn-sm" onclick="showModal('add')"><i class="bi bi-plus-lg me-1"></i>新增摄像头</button></div>
<div class="row mb-3 g-2"><div class="col-md-3"><input class="form-control form-control-sm" placeholder="搜索名称/编码/型号/位置" id="fKeyword"></div><div class="col-md-2"><select class="form-select form-select-sm" id="fStatus"><option value="">全部状态</option><option value="1">正常</option><option value="2">离线</option><option value="3">故障</option><option value="4">维护中</option></select></div><div class="col-md-2"><select class="form-select form-select-sm" id="fCloudBox"><option value="">全部云盒</option>{% for cb in cloud_boxes %}<option value="{{ cb.id }}">{{ cb.device_name }}</option>{% endfor %}</select></div><div class="col-md-2"><button class="btn btn-outline-secondary btn-sm" onclick="loadCameras()"><i class="bi bi-search"></i> 筛选</button></div></div>
<div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th>ID</th><th>编码</th><th>名称</th><th>型号</th><th>类型</th><th>位置</th><th>经纬度</th><th>监测物质</th><th>关联云盒</th><th>状态</th><th>操作</th></tr></thead><tbody id="camTableBody"></tbody></table></div>
<div class="d-flex justify-content-between mt-3"><small class="text-muted" id="camPageInfo"></small><div class="btn-group btn-group-sm" id="camPagination"></div></div>
</div></div></div>

<div class="modal fade" id="camModal" tabindex="-1"><div class="modal-dialog modal-xl"><div class="modal-content"><div class="modal-header bg-danger text-white"><h6 class="modal-title"><i class="bi bi-camera-video me-1"></i><span id="modalTitle">新增摄像头</span></h6><button class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body"><input type="hidden" id="camId">
<div class="row g-3">
<div class="col-md-4"><label class="form-label">设备编码 <span class="text-danger">*</span></label><input class="form-control" id="cCode"></div>
<div class="col-md-4"><label class="form-label">设备名称 <span class="text-danger">*</span></label><input class="form-control" id="cName"></div>
<div class="col-md-4"><label class="form-label">设备型号</label><input class="form-control" id="cModel"></div>
<div class="col-md-3"><label class="form-label">摄像头类型</label><select class="form-select" id="cType"><option value="固定摄像头">固定摄像头</option><option value="PTZ云台摄像头">PTZ云台摄像头</option><option value="球型摄像头">球型摄像头</option><option value="枪型摄像头">枪型摄像头</option></select></div>
<div class="col-md-3"><label class="form-label">IP地址</label><input class="form-control" id="cIp"></div>
<div class="col-md-2"><label class="form-label">端口</label><input type="number" class="form-control" id="cPort" value="554"></div>
<div class="col-md-4"><label class="form-label">RTSP地址</label><input class="form-control" id="cRtsp" placeholder="rtsp://..."></div>
<div class="col-md-3"><label class="form-label">分辨率</label><input class="form-control" id="cRes" value="1920x1080"></div>
<div class="col-md-2"><label class="form-label">帧率(fps)</label><input type="number" class="form-control" id="cFps" value="25"></div>
<div class="col-md-3"><label class="form-label">监测物质</label><input class="form-control" id="cSubstance" value="火焰/烟雾"></div>
<div class="col-md-4"><label class="form-label">PTZ支持</label><select class="form-select" id="cPtz"><option value="0">不支持</option><option value="1">支持</option></select></div>
<div class="col-md-8"><label class="form-label">安装位置描述</label><input class="form-control" id="cLocation" placeholder="例如：XX区XX路XX大楼顶层"></div>
<div class="col-md-3"><label class="form-label">经度 <span class="text-danger">*</span></label><input type="number" step="any" class="form-control" id="cLng" placeholder="116.404"></div>
<div class="col-md-3"><label class="form-label">纬度 <span class="text-danger">*</span></label><input type="number" step="any" class="form-control" id="cLat" placeholder="39.915"></div>
<div class="col-md-2"><label class="form-label">海拔(米)</label><input type="number" step="any" class="form-control" id="cAlt" value="0"></div>
<div class="col-md-2"><label class="form-label">视野范围(米)</label><input type="number" class="form-control" id="cView" value="500"></div>
<div class="col-md-2"><label class="form-label">状态</label><select class="form-select" id="cStatus"><option value="1">正常</option><option value="2">离线</option><option value="3">故障</option><option value="4">维护中</option></select></div>
<div class="col-md-6"><label class="form-label">关联AI云盒</label><select class="form-select" id="cCloudBox"><option value="">无</option>{% for cb in cloud_boxes %}<option value="{{ cb.id }}">{{ cb.device_name }}</option>{% endfor %}</select></div>
<div class="col-md-6"><label class="form-label">现场照片URL</label><input class="form-control" id="cImage" placeholder="https://..."></div>
</div></div><div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">取消</button><button class="btn btn-danger" onclick="saveCamera()">保存</button></div></div></div></div>
{% endblock %}
{% block extra_js %}
<script>
let editMode='add',camPage=1;
$(function(){loadCameras();});
function loadCameras(page=1){camPage=page;let params={page,per_page:15,keyword:$('#fKeyword').val(),status:$('#fStatus').val(),cloud_box_id:$('#fCloudBox').val()};Object.keys(params).forEach(k=>{if(!params[k])delete params[k]});$.get('/api/v1/cameras',params,function(res){if(res.code===200){let rows=res.data.items.map(function(c){var dc=escHtml(c.device_code),dn=escHtml(c.device_name),dm=escHtml(c.device_model),ct=escHtml(c.camera_type),loc=escHtml(c.location),cbn=escHtml(c.cloud_box_name),sn=escHtml(c.status_name),ms=escHtml(c.monitor_substance),lng=c.longitude?Number(c.longitude).toFixed(4):'-',lat=c.latitude?Number(c.latitude).toFixed(4):'-',sd=c.status===1?'online':c.status===3?'fault':'offline';return'<tr><td>'+c.id+'</td><td><code>'+dc+'</code></td><td><strong>'+dn+'</strong></td><td>'+dm+'</td><td>'+ct+'</td><td>'+loc+'</td><td>'+lng+','+lat+'</td><td>'+ms+'</td><td>'+cbn+'</td><td><span class="status-dot '+sd+'"></span>'+sn+'</td><td><button class="btn btn-info btn-sm text-white me-1" onclick="editCam('+c.id+')"><i class="bi bi-pencil"></i></button><button class="btn btn-danger btn-sm delete-btn" data-id="'+c.id+'" data-name="'+dn+'"><i class="bi bi-trash"></i></button></td></tr>';}).join('');$('#camTableBody').html(rows||'<tr><td colspan="11" class="text-center py-4 text-muted">暂无数据</td></tr>');$('#camPageInfo').text('共 '+res.data.total+' 条');var ph='';for(var i=1;i<=res.data.pages;i++)ph+='<button class="btn btn-'+(i===res.data.page?'danger':'outline-secondary')+'" onclick="loadCameras('+i+')">'+i+'</button>';$('#camPagination').html(ph);}});}
function showModal(mode){editMode=mode;$('#modalTitle').text(mode==='add'?'新增摄像头':'修改摄像头');$('#camId').val('');$('#cCode').val('');$('#cName').val('');$('#cModel').val('');$('#cType').val('固定摄像头');$('#cIp').val('');$('#cPort').val(554);$('#cRtsp').val('');$('#cRes').val('1920x1080');$('#cFps').val(25);$('#cSubstance').val('火焰/烟雾');$('#cPtz').val(0);$('#cLocation').val('');$('#cLng').val('');$('#cLat').val('');$('#cAlt').val(0);$('#cView').val(500);$('#cStatus').val(1);$('#cCloudBox').val('');$('#cImage').val('');$('#camModal').modal('show');}
function editCam(id){$.get('/api/v1/cameras?page=1&per_page=200',function(res){let c=res.data.items.find(i=>i.id===id);if(!c)return alert('设备不存在');editMode='edit';$('#modalTitle').text('修改摄像头');$('#camId').val(c.id);$('#cCode').val(c.device_code);$('#cName').val(c.device_name);$('#cModel').val(c.device_model||'');$('#cType').val(c.camera_type||'固定摄像头');$('#cIp').val(c.ip_address||'');$('#cPort').val(c.port||554);$('#cRtsp').val(c.rtsp_url||'');$('#cRes').val(c.resolution||'1920x1080');$('#cFps').val(c.frame_rate||25);$('#cSubstance').val(c.monitor_substance||'火焰/烟雾');$('#cPtz').val(c.ptz_support?1:0);$('#cLocation').val(c.location||'');$('#cLng').val(c.longitude||'');$('#cLat').val(c.latitude||'');$('#cAlt').val(c.altitude||0);$('#cView').val(c.view_range||500);$('#cStatus').val(c.status);$('#cCloudBox').val(c.cloud_box_id||'');$('#cImage').val(c.image_url||'');$('#camModal').modal('show');});}
function saveCamera(){let data={device_code:$('#cCode').val(),device_name:$('#cName').val(),device_model:$('#cModel').val(),camera_type:$('#cType').val(),ip_address:$('#cIp').val(),port:parseInt($('#cPort').val())||554,rtsp_url:$('#cRtsp').val(),resolution:$('#cRes').val(),frame_rate:parseInt($('#cFps').val())||25,monitor_substance:$('#cSubstance').val(),ptz_support:$('#cPtz').val()==='1',location:$('#cLocation').val(),longitude:parseFloat($('#cLng').val()),latitude:parseFloat($('#cLat').val()),altitude:parseFloat($('#cAlt').val())||0,view_range:parseFloat($('#cView').val())||500,status:parseInt($('#cStatus').val()),cloud_box_id:$('#cCloudBox').val()||null,image_url:$('#cImage').val()};if(!data.device_code||!data.device_name)return alert('请填写必要字段');if(!data.longitude||!data.latitude)return alert('请填写经纬度');let url=editMode==='add'?'/api/v1/cameras':'/api/v1/cameras/'+$('#camId').val(),method=editMode==='add'?'POST':'PUT';$.ajax({url,method,contentType:'application/json',data:JSON.stringify(data),success(r){alert(r.msg);$('#camModal').modal('hide');loadCameras(camPage);},error(xhr){alert(xhr.responseJSON?.msg||'操作失败');}});}
</script>
{% endblock %}
