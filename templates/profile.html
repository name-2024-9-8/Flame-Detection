{% extends "base.html" %}
{% block title %}个人资料 - {{ site_name }}{% endblock %}
{% block extra_css %}
<style>.page-container{padding:20px;background:#f5f6fa;min-height:calc(100vh - 100px)}.card-custom{background:#fff;border-radius:14px;padding:30px;box-shadow:0 2px 12px rgba(0,0,0,.06);max-width:600px;margin:0 auto}</style>{% endblock %}
{% block content %}
<div class="page-container"><div class="container-fluid"><div class="card-custom">
<h4 class="fw-bold mb-4"><i class="bi bi-person me-2"></i>个人资料</h4>
<form method="POST" action="{{ url_for('auth.update_profile') }}">
<div class="mb-3"><label class="form-label">用户名</label><input class="form-control" value="{{ user.username }}" disabled></div>
<div class="mb-3"><label class="form-label">真实姓名</label><input class="form-control" name="real_name" value="{{ user.real_name or '' }}"></div>
<div class="mb-3"><label class="form-label">邮箱</label><input type="email" class="form-control" name="email" value="{{ user.email or '' }}"></div>
<div class="mb-3"><label class="form-label">手机号</label><input class="form-control" name="phone" value="{{ user.phone or '' }}"></div>
<div class="mb-3"><label class="form-label">用户类型</label><input class="form-control" value="{{ '超级用户' if user.user_type==1 else '普通用户' }}" disabled></div>
<div class="mb-3"><label class="form-label">所属角色</label><input class="form-control" value="{{ user.role.name if user.role else '未分配' }}" disabled></div>
<div class="mb-3"><label class="form-label">登录次数</label><input class="form-control" value="{{ user.login_count or 0 }}" disabled></div>
<div class="mb-3"><label class="form-label">最后登录</label><input class="form-control" value="{{ user.last_login_at|datetime_format if user.last_login_at else '首次登录' }}" disabled></div>
<hr><h6 class="fw-bold mb-3">修改密码</h6>
<div class="mb-3"><label class="form-label">新密码（留空则不修改）</label><input type="password" class="form-control" name="new_password" placeholder="至少6位字符" minlength="6"></div>
<div class="text-end"><button type="submit" class="btn btn-danger"><i class="bi bi-check-lg me-1"></i>保存修改</button></div>
</form></div></div></div>
{% endblock %}
