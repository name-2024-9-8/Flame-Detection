<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>{{ code }} - 错误</title>
<link href="{{ url_for('static', filename='lib/css/bootstrap.min.css') }}" rel="stylesheet">
<link href="{{ url_for('static', filename='lib/css/bootstrap-icons.css') }}" rel="stylesheet">
<style>body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);font-family:'Microsoft YaHei',sans-serif}.error-card{text-align:center;color:#fff;animation:fadeIn .5s ease-out}@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}.error-code{font-size:120px;font-weight:900;line-height:1;background:linear-gradient(135deg,#e74c3c,#f39c12);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:10px}.error-msg{font-size:24px;margin-bottom:10px;opacity:.9}.error-desc{font-size:14px;color:#888;margin-bottom:30px}.btn-back{padding:12px 30px;border-radius:10px;background:#e74c3c;color:#fff;font-weight:600;text-decoration:none;transition:all .3s;display:inline-block}.btn-back:hover{background:#c0392b;color:#fff;transform:translateY(-2px);box-shadow:0 8px 25px rgba(231,76,60,.4)}</style></head>
<body><div class="error-card"><div class="error-code">{{ code }}</div><div class="error-msg">{{ msg }}</div><div class="error-desc">请检查地址是否正确，或返回首页</div><a href="/" class="btn-back"><i class="bi bi-house me-2"></i>返回首页</a></div></body></html>
