{% extends "base.html" %}
{% block title %}操作日志 - {{ site_name }}{% endblock %}
{% block extra_css %}
<style>.page-container{padding:20px;background:#f5f6fa;min-height:calc(100vh - 100px)}.card-custom{background:#fff;border-radius:14px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,.06)}.table th{background:#f8f9fa;font-size:13px;font-weight:700;color:#1a1a2e;border-bottom:2px solid #e74c3c}</style>{% endblock %}
{% block content %}
<div class="page-container"><div class="container-fluid"><div class="card-custom">
<h4 class="fw-bold mb-3"><i class="bi bi-pencil-square me-2"></i>操作日志</h4>
<div class="row mb-3 g-2"><div class="col-md-3"><input class="form-control form-control-sm" placeholder="搜索用户名" id="fUsername"></div><div class="col-md-2"><select class="form-select form-select-sm" id="fOpType"><option value="">操作类型</option><option value="CREATE">CREATE</option><option value="UPDATE">UPDATE</option><option value="DELETE">DELETE</option><option value="LOGIN">LOGIN</option><option value="LOGOUT">LOGOUT</option></select></div><div class="col-md-2"><button class="btn btn-outline-secondary btn-sm" onclick="loadLogs()"><i class="bi bi-search"></i> 筛选</button></div></div>
<div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th>ID</th><th>用户</th><th>操作类型</th><th>模块</th><th>操作描述</th><th>IP</th><th>操作时间</th></tr></thead><tbody id="logTableBody"></tbody></table></div>
<div class="d-flex justify-content-between mt-3"><small class="text-muted" id="logPageInfo"></small><div class="btn-group btn-group-sm" id="logPagination"></div></div>
</div></div></div>
{% endblock %}
{% block extra_js %}
<script>
let logPage=1;
$(function(){loadLogs();});
function loadLogs(page=1){logPage=page;let params={page,per_page:20,username:$('#fUsername').val(),operation_type:$('#fOpType').val()};Object.keys(params).forEach(k=>{if(!params[k])delete params[k]});$.get('/api/v1/logs/operation',params,function(res){if(res.code===200){let typeBadge={'CREATE':'bg-success','UPDATE':'bg-primary','DELETE':'bg-danger','LOGIN':'bg-info','LOGOUT':'bg-secondary'};let rows=res.data.items.map(l=>`<tr><td>${l.id}</td><td>${l.username||'-'}</td><td><span class="badge ${typeBadge[l.operation_type]||'bg-dark'}">${l.operation_type||'-'}</span></td><td>${l.operation_module||'-'}</td><td>${l.operation_desc||'-'}</td><td>${l.ip_address||'-'}</td><td>${l.created_at||'-'}</td></tr>`).join('');$('#logTableBody').html(rows||'<tr><td colspan="7" class="text-center py-4 text-muted">暂无记录</td></tr>');$('#logPageInfo').text(`共 ${res.data.total} 条`);let ph='';for(let i=1;i<=res.data.pages;i++)ph+=`<button class="btn btn-${i===res.data.page?'danger':'outline-secondary'}" onclick="loadLogs(${i})">${i}</button>`;$('#logPagination').html(ph);}});}
</script>
{% endblock %}
